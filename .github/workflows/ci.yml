name: CI

# Runs on pushes to main and test, and on pull requests, so a pull request from test into main
# has a check to pass before it's merged.
on:
  push:
    branches: [main, test]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: VERSION.md is a Date Version matching CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version checks
        run: bash tests/version.sh
