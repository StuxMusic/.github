name: CI

# Runs on pushes to main, staging and test, and on pull requests, so each pull request on the way
# live (test into staging, staging into main) has a check to pass before it's merged.
on:
  push:
    branches: [main, staging, test]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: VERSION.md is a Date Version matching CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version checks
        run: bash tests/version.sh
